<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="citPwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d4ed8" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Base Container -->
  <rect width="512" height="512" rx="110" fill="url(#citPwaGrad)" />
  
  <!-- Subtle Internal Grid Pattern / Shine -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  
  <!-- Main Ledger / Accounting Card -->
  <g filter="url(#shadow)">
    <rect x="110" y="110" width="292" height="292" rx="36" fill="rgba(255,255,255,0.08)" stroke="#ffffff" stroke-width="18" />
  </g>
  
  <!-- Ledger Rows -->
  <line x1="165" y1="195" x2="347" y2="195" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="165" y1="256" x2="347" y2="256" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="165" y1="317" x2="275" y2="317" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />

  <!-- Growth Badge Indicator -->
  <circle cx="390" cy="122" r="46" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="10" />
  <path d="M 374 128 L 390 112 L 406 128" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="390" y1="114" x2="390" y2="134" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
</svg>
